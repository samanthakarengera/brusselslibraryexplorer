
<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>Brusselse Bibliotheken</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="favorites.html">Favorieten</a>
            <a href="about.html">Over</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>


    <main>

        <section class="welkom">

            <h2>Contact</h2>

            <p>
                Heb je een vraag of een suggestie?
                Laat het ons weten.
            </p>

        </section>


        <section class="kaart contact">

            <form id="contactForm">

                <label for="naam">Naam</label>

                <input
                    type="text"
                    id="naam"
                    name="naam"
                    placeholder="Je naam"
                    required>


                <label for="email">E-mailadres</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="jouw@email.be"
                    required>


                <label for="bericht">Bericht</label>

                <textarea
                    id="bericht"
                    name="bericht"
                    rows="6"
                    placeholder="Schrijf hier je bericht..."
                    required></textarea>


                <button type="submit">
                    Versturen
                </button>

            </form>

        </section>

    </main>


    <footer>

        <p>Brusselse Bibliotheken © 2026</p>

    </footer>


    <script>

        const formulier =
            document.getElementById("contactForm");

            formulier.addEventListener("submit", function(event) {

            event.preventDefault();

            alert("Bedankt voor je bericht!");

            formulier.reset();

        });

    </script>

</body>

</html>
