<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brusselse Bibliotheken</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>Brusselse Bibliotheken</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="favorites.html">Favorieten</a>
            <a href="about.html">Over</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>

    <main>

        <section class="welkom">

            <h2>Ontdek bibliotheken in Brussel</h2>
            <p>
                Zoek, filter en bewaar jouw favoriete bibliotheken.
            </p>

        </section>


        <section class="zoeken">

            <input
                type="text"
                id="zoek"
                placeholder="Zoek een bibliotheek">

            <select id="filter">

                <option>Alle gemeenten</option>

            </select>

            <select id="sorteren">

                <option>A-Z</option>
                <option>Z-A</option>

            </select>

        </section>


        <section id="bibliotheken">

            <!-- Bibliotheken komen hier -->

        </section>

    </main>


    <footer>
        <p>Brusselse Bibliotheken © 2026</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
