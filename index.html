<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brusselse Bibliotheken</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>Brusselse Bibliotheken</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="favorites.html">Favorieten</a>
            <a href="about.html">Over</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>

    <main>

        <section class="welkom">
            <h2>Ontdek Brusselse bibliotheken</h2>
            <p>
                Zoek eenvoudig tussen Nederlandstalige en Franstalige bibliotheken.
            </p>
        </section>

        <section class="filters">
            <input
                type="text"
                id="zoek"
                placeholder="Zoek een bibliotheek...">

            <select id="taal">

                <option value="alles">Alle talen</option>
                <option value="Nederlandstalig">Nederlandstalig</option>
                <option value="Franstalig">Franstalig</option>

            </select>

            <select id="postcode">
                 <option value="alles">Alle postcodes</option>
            </select>

            <select id="sorteren">

                <option value="az">Naam A-Z</option>
                <option value="za">Naam Z-A</option>

            </select>

        </section>

        <section id="bibliotheken">

            <!-- Hier komen de kaarten -->

        </section>

    </main>

    <footer>
        <p>Brusselse Bibliotheken © 2026</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
